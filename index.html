<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">


<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>my plan 🌸</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="my plan 🌸">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e84f8a">

<style>
*{box-sizing:border-box;margin:0;padding:0}html{background:#e84f8a}body{padding-top:env(safe-area-inset-top);font-family:'Segoe UI',system-ui,sans-serif;background:#fff5f8;color:#1a1a1a;-webkit-tap-highlight-color:transparent;padding-bottom:70px}
.ctr{max-width:640px;margin:0 auto;padding:16px 16px 40px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#f072a8;font-weight:600}
h1{font-size:22px;font-weight:700;margin:4px 0 4px;line-height:1.2}.sub{font-size:13px;color:#666;margin-bottom:4px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid #f0c0d5;display:flex;z-index:100;padding:4px 0;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:none;background:none;cursor:pointer;padding:6px 0;font-size:10px;color:#999;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}.bnav button.on{color:#e84f8a;font-weight:700}.bnav button .bi{font-size:20px}
.pg{display:none}.pg.on{display:block}
.dbar{display:flex;gap:5px;margin:0 0 16px;overflow-x:auto;padding-bottom:4px}
.dbtn{flex:1 0 auto;min-width:44px;padding:8px 4px;border:none;border-radius:10px;cursor:pointer;font-size:12px;font-weight:500;background:#ffd6e8;color:#555;transition:all .2s;text-align:center;line-height:1.3}
.dbtn.on{background:#e84f8a;color:#fff;font-weight:700}.dbtn .di{font-size:10px;display:block;margin-top:1px;opacity:.6}
.dsum{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:5px 11px;font-size:11px;font-weight:600}
.pill.f{background:#fff0f5;color:#e84f8a}.pill.g{background:#f8e8ff;color:#b05ab0}.pill.r{background:#f0e8ff;color:#9a7ab8}
.card{background:#fff;border:1px solid #f0c0d5;border-radius:12px;padding:14px;transition:border .2s;position:relative;margin-bottom:10px}
.card.exp{border:1.5px solid #e84f8a}.card.clk{cursor:pointer}
.mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;flex-wrap:wrap;gap:4px}
.mt{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#999;font-weight:600}
.mm{display:flex;gap:5px;align-items:center}
.tb{font-size:10px;color:#888;background:#ffe8f0;border-radius:6px;padding:2px 6px}
.pt{font-size:10px;color:#e84f8a;background:#ffe0ee;border-radius:6px;padding:2px 6px;font-weight:600}
.arr{font-size:13px;color:#999;transition:transform .2s;display:inline-block}.arr.o{transform:rotate(180deg)}
.tr{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.mn{font-size:15px;font-weight:650;margin-bottom:4px;flex:1}
.fb{background:none;border:none;font-size:16px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;opacity:.3;transition:opacity .2s}.fb.on{opacity:1}
.md{font-size:12px;color:#555;line-height:1.5}
.vibes{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.vb{font-size:10px;color:#d06a90;background:#ffe8f0;border-radius:20px;padding:2px 7px;font-weight:500}
.tip{font-size:11px;color:#8a6aaa;background:#f0e8ff;border-radius:8px;padding:4px 8px;margin-top:5px;line-height:1.4}
.tip::before{content:"💡 "}
.rcp{margin-top:10px;padding-top:10px;border-top:1px dashed #e0ddd8;display:none}.rcp.show{display:block}
.rhd{font-size:11px;font-weight:700;color:#e84f8a;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px}
.rcp ul,.rcp ol{padding-left:16px}.rcp li{font-size:12px;color:#555;line-height:1.6;margin-bottom:2px}
.rcp ul{margin-bottom:10px;list-style:disc}.rcp ol{list-style:decimal}
.sw{margin-top:8px;padding-top:8px;border-top:1px dashed #f0c0d5}
.swt{font-size:10px;color:#999;margin-bottom:4px;font-weight:600}
.swo{font-size:11px;color:#f072a8;background:#ffe8f0;border-radius:8px;padding:8px 10px;margin-bottom:4px;line-height:1.4;cursor:pointer;transition:all .15s;border:1px solid transparent}
.swo:hover,.swo:active{border-color:#e84f8a;background:#ffd6e8}
.swapped-tag{font-size:10px;color:#fff;background:#9a7ab8;border-radius:12px;padding:2px 8px;font-weight:600;margin-right:6px}
.swap-back{font-size:11px;color:#b05ab0;background:#f8e8ff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;margin-top:8px}
/* Portion adjuster */
.por{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.por-label{font-size:11px;color:#888;font-weight:600}
.por-btn{width:30px;height:30px;border-radius:8px;border:2px solid #f0c0d5;background:#fff;cursor:pointer;font-size:12px;font-weight:700;color:#888;transition:all .15s;display:flex;align-items:center;justify-content:center}
.por-btn.on{background:#e84f8a;border-color:#e84f8a;color:#fff}
body.dark .por-btn{background:#2a1520;border-color:#444;color:#999}
body.dark .por-btn.on{background:#c05080;border-color:#c05080;color:#fff}
body.dark .swo{background:#2a1520;color:#9a8a7a}
body.dark .swo:hover{border-color:#c05080;background:#3a1a2a}
body.dark .swap-back{background:#2a1a35;color:#b09ad0}
.ws{font-size:11px;font-weight:700;color:#b05ab0;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;padding-top:6px;border-top:1px solid #f8e8ff}.ws:first-child{border-top:none;margin-top:0;padding-top:0}
.ex{background:#fff;border:1px solid #f0c0d5;border-radius:12px;padding:12px;margin-bottom:8px}
.en{font-size:14px;font-weight:650;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.efl{font-size:10px;color:#b05ab0;text-decoration:none;background:#f8e8ff;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap;flex-shrink:0}
.es{font-size:12px;color:#b05ab0;font-weight:600;margin-bottom:3px}
.eno{font-size:11px;color:#888;line-height:1.4}
.et{display:inline-block;font-size:9px;color:#fff;background:#b05ab0;border-radius:12px;padding:2px 7px;margin-top:3px;font-weight:600;margin-right:4px}
.et.abs{background:#f072a8}.et.sh{background:#5a7c6b}
.sr{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.sd{width:30px;height:30px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:600;color:#bbb;transition:all .15s}.sd.dn{background:#b05ab0;border-color:#b05ab0;color:#fff}
.wl{display:flex;align-items:center;gap:4px;margin-top:6px}
.wl label{font-size:10px;color:#999}.wl input{width:50px;border:1px solid #ddd;border-radius:6px;padding:4px 6px;font-size:12px;text-align:center;font-family:inherit}
.wl .pv{font-size:10px;color:#bbb;margin-left:4px}
.tbar{position:fixed;bottom:60px;left:0;right:0;background:#b05ab0;color:#fff;padding:10px 16px;display:none;justify-content:space-between;align-items:center;z-index:99}.tbar.on{display:flex}
.tt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tbar button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600}
.btn{background:#b05ab0;border:none;color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;margin-right:4px}.btn.sm{padding:4px 10px;font-size:10px}
.sc{background:#fff;border:1px solid #f0c0d5;border-radius:12px;padding:12px;margin-bottom:8px}
.scn{font-size:14px;font-weight:600;margin-bottom:2px}.scd{font-size:11px;color:#9a7ab8;font-weight:600;margin-bottom:3px}
.scno{font-size:11px;color:#888;line-height:1.4}
.rs{font-size:11px;font-weight:700;color:#9a7ab8;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px}
.stc{background:#fff;border:1px solid #f0c0d5;border-radius:12px;padding:16px;margin-bottom:12px}
.stc h3{font-size:14px;font-weight:700;color:#e84f8a;margin-bottom:8px}
.stc p{font-size:12px;color:#555;line-height:1.5;margin-bottom:5px}.stc p:last-child{margin-bottom:0}
.strow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid #ffe8f2}.strow:last-child{border-bottom:none}
.stday{font-size:13px;font-weight:600;width:60px}
.stsel{border:1px solid #ddd;border-radius:8px;padding:6px 8px;font-size:12px;background:#fff;font-family:inherit;flex:1;margin-left:8px;max-width:200px}
.scat{margin-bottom:16px}
.sct{font-size:12px;font-weight:700;color:#e84f8a;margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid #f0c0d5}
.si{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;color:#444;cursor:pointer;user-select:none}.si.chk{color:#bbb;text-decoration:line-through}
.cb{width:18px;height:18px;border-radius:5px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.si.chk .cb{background:#e84f8a;border-color:#e84f8a}.cb::after{content:'✓';color:#fff;font-size:10px;font-weight:700;opacity:0}.si.chk .cb::after{opacity:1}
.spg{font-size:11px;color:#888;margin-bottom:12px}
.spb{height:5px;background:#ffd6e8;border-radius:3px;margin-top:5px;overflow:hidden}
.spf{height:100%;background:linear-gradient(90deg,#f5a0c0,#e84f8a);border-radius:3px;transition:width .3s}
.ic{background:#fff;border:1px solid #f0c0d5;border-radius:12px;padding:14px;margin-bottom:10px}
.ic h3{font-size:13px;font-weight:700;margin-bottom:5px;color:#e84f8a}
.ic p{font-size:12px;color:#555;line-height:1.5;margin-bottom:5px}
.ps{display:flex;gap:10px;margin-bottom:8px}
.pn{width:24px;height:24px;background:#ffe0ee;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#e84f8a;flex-shrink:0}
.ptx{font-size:12px;color:#555;line-height:1.4}
.clr{background:none;border:1px solid #ddd;border-radius:8px;padding:6px 12px;font-size:11px;color:#888;cursor:pointer;margin-top:6px}.clr:hover{border-color:#e84f8a;color:#e84f8a}
.fli{background:#fff;border:1px solid #f0c0d5;border-radius:12px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.fln{font-size:13px;font-weight:600}.fld{font-size:10px;color:#888;margin-top:1px}
.frm{background:none;border:none;font-size:14px;cursor:pointer;color:#ccc;padding:4px}
.empty{text-align:center;padding:30px 20px;color:#aaa;font-size:12px}.empty span{font-size:28px;display:block;margin-bottom:8px}
.thdr{background:linear-gradient(135deg,#e84f8a,#f472b6);border-radius:14px;padding:20px;color:#fff;margin-bottom:16px}
.tdy{font-size:24px;font-weight:700}.tdt{font-size:12px;opacity:.7;margin-top:2px}
.ttp{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;margin-top:8px}
.shdr{font-size:13px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.shdr.gh{color:#b05ab0}.shdr.rh{color:#9a7ab8}.shdr.fh{color:#e84f8a}
.pov{margin-top:20px;border-top:1px solid #f0c0d5}.pov summary{cursor:pointer;font-size:12px;font-weight:600;color:#e84f8a;padding:8px 0}
.brow{display:flex;align-items:center;gap:8px;margin-bottom:6px}.bl{font-size:11px;width:32px;color:#666}.bt{flex:1;background:#ffd6e8;border-radius:5px;height:10px;overflow:hidden}.bf{height:100%;background:linear-gradient(90deg,#f5a0c0,#e84f8a);border-radius:5px}.bv{font-size:11px;font-weight:600;color:#e84f8a;width:32px;text-align:right}
.ftr{font-size:10px;color:#aaa;margin-top:20px;text-align:center}
.wbb{display:flex;gap:5px;margin:0 0 16px;overflow-x:auto;padding-bottom:4px}
.wb{flex:1 0 auto;min-width:55px;padding:8px 6px;border:none;border-radius:10px;cursor:pointer;font-size:11px;font-weight:500;background:#f8e8ff;color:#c080d0;transition:all .2s;text-align:center}.wb.on{background:#b05ab0;color:#fff;font-weight:700}
.wb .wd{font-size:9px;opacity:.7;display:block;margin-top:1px}
.rab{display:flex;gap:6px;margin-bottom:14px}
.ra{flex:1;padding:8px;border:none;border-radius:10px;cursor:pointer;font-size:11px;font-weight:500;background:#f0e8ff;color:#9a7ab8;text-align:center;transition:all .2s}.ra.on{background:#9a7ab8;color:#fff;font-weight:700}
/* Water tracker */
.wtr{background:#fff;border:1px solid #f0c0d5;border-radius:12px;padding:14px;margin-bottom:12px}
.wtr-title{font-size:12px;font-weight:700;color:#e84f8a;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.wtr-glasses{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.wtr-g{width:28px;height:28px;border-radius:8px;border:2px solid #e8c0d0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;transition:all .15s}
.wtr-g.full{background:#e84f8a;border-color:#e84f8a}.wtr-g.full::after{content:'💖';font-size:12px}
.wtr-g.empty::after{content:'·';color:#ccc;font-size:16px}
/* Workout notes */
.wnote{margin-top:12px}
.wnote textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:12px;font-family:inherit;resize:vertical;min-height:60px;color:#555;background:#fff5f8}
.wnote label{font-size:11px;color:#999;display:block;margin-bottom:4px;font-weight:600}
/* Weekly review */
.wrev{background:#fff;border:1px solid #f0c0d5;border-radius:12px;padding:14px;margin-bottom:12px}
.wrev-title{font-size:12px;font-weight:700;color:#e84f8a;margin-bottom:10px}
.wrev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wrev-stat{background:#fff0f5;border-radius:10px;padding:10px;text-align:center}
.wrev-num{font-size:22px;font-weight:700;color:#e84f8a}.wrev-lbl{font-size:10px;color:#888;margin-top:2px}
/* Dark mode toggle */
.dm-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.dm-switch{width:44px;height:24px;background:#ddd;border-radius:12px;cursor:pointer;position:relative;transition:background .2s}
.dm-switch.on{background:#e84f8a}
.dm-switch::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform .2s}
.dm-switch.on::after{transform:translateX(20px)}
/* Dark mode */
body.dark{background:#1f1018;color:#ddd}
body.dark h1{color:#e8e8e8}
body.dark .lbl{color:#9a8a7e}
body.dark .sub,.body.dark .md{color:#999}
body.dark .card,.dark .ex,.dark .sc,.dark .stc,.dark .ic,.dark .fli,.dark .wtr,.dark .wrev{background:#2a1520;border-color:#3a1a2a}
body.dark .bnav{background:#1f1018;border-color:#3a1a2a}
body.dark .dbtn{background:#2a1520;color:#999}
body.dark .dbtn.on{background:#c05080;color:#fff}
body.dark .pill.f{background:#3a2030;color:#f5a0c0}
body.dark .pill.g{background:#2a1525;color:#b090d0}
body.dark .pill.r{background:#1a1a2a;color:#b0a0d0}
body.dark .thdr{background:linear-gradient(135deg,#2a1025,#8a3060)}
body.dark .mn,.dark .en span,.dark .scn{color:#e0e0e0}
body.dark .md,.dark .eno,.dark .ptx,.dark .stc p,.dark .ic p,.dark .scno{color:#999}
body.dark .mt,.dark .mtype{color:#777}
body.dark .pt{background:#3a2030;color:#f5a0c0}
body.dark .tb{background:#2a1520;color:#999}
body.dark .vb{background:#2a1520;color:#9a8a7a}
body.dark .tip{background:#1a1a2a;color:#b0a0d0}
body.dark .ws{border-color:#3a1a2a;color:#7a8ac0}
body.dark .efl{background:#2a1a35;color:#b09ad0}
body.dark .sd{border-color:#444}
body.dark .btn{background:#b060b0}
body.dark input,.dark select,.dark textarea{background:#2a1520;border-color:#444;color:#ddd}
body.dark .sct{color:#f5a0c0;border-color:#3a1a2a}
body.dark .si{color:#bbb}
body.dark .cb{border-color:#555}
body.dark .si.chk .cb{background:#c05080;border-color:#c05080}
body.dark .strow{border-color:#3a1a2a}
body.dark .sw,.dark .rcp{border-color:#3a1a2a}
body.dark .swo{background:#2a1520;color:#9a8a7a}
body.dark .wrev-stat{background:#2a1520}
body.dark .wrev-num{color:#f5a0c0}
body.dark .wtr-g{border-color:#8a3060}
body.dark .wtr-g.full{background:#8a3060;border-color:#8a3060}
body.dark .wnote textarea{background:#2a1520;border-color:#444;color:#ccc}
body.dark .ra{background:#1a1a2a;color:#a090c0}
body.dark .ra.on{background:#7a5a9a}
body.dark .pov{border-color:#3a1a2a}
body.dark .bt{background:#2a1520}
body.dark .spb{background:#2a1520}
body.dark .clr{border-color:#444;color:#999}
body.dark .dm-switch{background:#555}
/* Timetable */
.tt-wrap{overflow-x:auto;margin:12px 0}
.tt-table{width:100%;min-width:500px;border-collapse:collapse;font-size:11px}
.tt-table th{background:#ffd6e8;color:#f072a8;font-weight:700;padding:8px 4px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:1px;border:1px solid #f0c0d5}
.tt-table td{padding:6px 4px;text-align:center;border:1px solid #f0c0d5;vertical-align:top;line-height:1.3;background:#fff}
.tt-table td.rest{background:#f0e8ff;color:#9a7ab8;font-style:italic}
.tt-table td.today{background:#fff0f5;font-weight:700}
.tt-table .tt-meal{font-weight:600;color:#e84f8a;font-size:11px}
.tt-table .tt-wo{font-weight:600;color:#b05ab0;font-size:11px}
.tt-table .tt-rest{color:#9a7ab8;font-size:11px}
.tt-table .tt-rowlbl{text-align:left;font-weight:700;color:#888;background:#fff5f8;padding:6px 8px;white-space:nowrap;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
body.dark .tt-table th{background:#2a1520;color:#9a8a7e;border-color:#3a1a2a}
body.dark .tt-table td{background:#2a1520;border-color:#3a1a2a;color:#ccc}
body.dark .tt-table td.rest{background:#1a1a2a}
body.dark .tt-table td.today{background:#3a2030}
body.dark .tt-table .tt-meal{color:#f5a0c0}
body.dark .tt-table .tt-wo{color:#b090d0}
body.dark .tt-table .tt-rowlbl{background:#1f1018}

/* Streak */
.streak{background:linear-gradient(135deg,#e84f8a,#f472b6);border-radius:12px;padding:14px;color:#fff;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.streak-num{font-size:28px;font-weight:700}.streak-lbl{font-size:11px;opacity:.8}
.streak-fire{font-size:24px}
/* Difficulty */
.diff{display:flex;gap:6px;margin-top:8px;align-items:center}
.diff-lbl{font-size:11px;color:#999;font-weight:600}
.diff-dot{width:28px;height:28px;border-radius:50%;border:2px solid #f0c0d5;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;font-weight:600;color:#ddd;transition:all .15s}
.diff-dot.on{background:#e84f8a;border-color:#e84f8a;color:#fff}
/* Volume tracker */
.vol-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.vol-lbl{font-size:11px;width:70px;color:#888;text-transform:capitalize}.vol-trk{flex:1;background:#ffd6e8;border-radius:5px;height:10px;overflow:hidden}
.vol-fil{height:100%;background:linear-gradient(90deg,#f5a0c0,#e84f8a);border-radius:5px}.vol-val{font-size:11px;font-weight:600;color:#e84f8a;width:40px;text-align:right}
/* Cycle */
.cyc-phase{border-radius:12px;padding:14px;margin-bottom:12px}
.cyc-phase.fol{background:#fff0f5;border:1px solid #f0c0d5}
.cyc-phase.lut{background:#f0e8ff;border:1px solid #d0c0e8}
.cyc-phase.men{background:#ffe8e8;border:1px solid #f0c0c0}

function scaleIng(ing,p){
if(p===1)return ing;
const m=ing.match(/^(\d+(?:\.\d+)?|½|¼|¾)/);
if(!m)return ing;
let n=m[1];if(n==='½')n=0.5;else if(n==='¼')n=0.25;else if(n==='¾')n=0.75;else n=parseFloat(n);
const s=n*p,rest=ing.slice(m[0].length);
if(s===0.5)return'½'+rest;if(s===0.25)return'¼'+rest;if(s===0.75)return'¾'+rest;
if(s===Math.floor(s))return s+rest;
return s.toFixed(1).replace(/\.0$/,'')+rest;
}

function checkStreak(){
  const today=todayKey();const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(streak.lastDate===today)return;
  if(streak.lastDate===yesterday){streak.count++;streak.lastDate=today;}
  else if(streak.lastDate!==today){streak.count=1;streak.lastDate=today;}
  localStorage.setItem('streak2',JSON.stringify(streak));debouncedSync();
}
checkStreak();

function setDiff(day,val){difficulty[day]=val;localStorage.setItem('diff',JSON.stringify(difficulty));debouncedSync();window._scrollSave=window.scrollY;render()}

function getProgressStr(ek){
  var hist=wlogHist['hist::'+ek];
  if(!hist||hist.length<2)return '';
  var vals=hist.map(function(h){return parseFloat(h.w)});
  var first=vals[0],last=vals[vals.length-1];
  var diff=last-first;
  if(diff>0)return ' 📈 +'+diff.toFixed(1)+'kg';
  if(diff<0)return ' 📉 '+diff.toFixed(1)+'kg';
  return ' =';
}

function logW(k,v){
  if(v){
    wlog[k]=v;
    const hk='hist::'+k;
    if(!wlogHist[hk])wlogHist[hk]=[];
    const today=todayKey();
    const last=wlogHist[hk][wlogHist[hk].length-1];
    if(!last||last.d!==today)wlogHist[hk].push({d:today,w:v});
    else last.w=v;
    if(wlogHist[hk].length>8)wlogHist[hk]=wlogHist[hk].slice(-8);
    localStorage.setItem('wlh',JSON.stringify(wlogHist));debouncedSync();
  }else delete wlog[k];
  saveWL();
}

function getVolume(){
  const vol={};
  for(let i=0;i<7;i++){if(!isTD(i))continue;const wo=getWO(i);if(!wo)continue;
    wo.sec.forEach(s=>s.ex.forEach(e=>{if(e.tg){if(!vol[e.tg])vol[e.tg]=0;vol[e.tg]+=e.s;}}));}
  return vol;
}

function getCyclePhase(){
  if(!cycleData.lastPeriod)return null;
  const start=new Date(cycleData.lastPeriod);const today=new Date();
  const dayInCycle=Math.floor((today-start)/(1000*60*60*24))%cycleData.cycleLength;
  if(dayInCycle<5)return{phase:"menstrual",day:dayInCycle+1,emoji:"🌸",title:"menstrual phase",tip:"Energy may be lower. Go lighter if needed, focus on form over weight. Extra iron-rich foods today. Be kind to yourself 💜",cls:"men"};
  if(dayInCycle<13)return{phase:"follicular",day:dayInCycle+1,emoji:"🌱",title:"follicular phase",tip:"Your strongest phase! Push harder, try for new PRs. Energy and recovery are at their peak. Make the most of it 💪",cls:"fol"};
  if(dayInCycle<16)return{phase:"ovulatory",day:dayInCycle+1,emoji:"✨",title:"ovulatory phase",tip:"Peak energy and strength. Great time for heavy lifts and challenging workouts. Stay hydrated 🌟",cls:"ovu"};
  return{phase:"luteal",day:dayInCycle+1,emoji:"🌙",title:"luteal phase",tip:"Energy starts to dip. You might crave more carbs — that's normal, eat them. Focus on steady workouts, don't push for PRs. Extra rest is okay 🧘‍♀️",cls:"lut"};
}

function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(data.cfg)cfg=data.cfg;if(data.chk)chk=data.chk;if(data.favs)favs=data.favs;
      if(data.setD)setD=data.setD;if(data.wlog)wlog=data.wlog;if(data.wlogHist)wlogHist=data.wlogHist;
      if(data.water)water=data.water;if(data.wnotes)wnotes=data.wnotes;
      if(data.activeSwaps)activeSwaps=data.activeSwaps;if(data.portions)portions=data.portions;
      if(data.streak)streak=data.streak;if(data.difficulty)difficulty=data.difficulty;
      if(data.cycleData)cycleData=data.cycleData;if(data.sleepData)sleepData=data.sleepData;if(data.studyChecks)studyChecks=data.studyChecks;if(data.studyProgress)studyProgress=data.studyProgress;if(data.blockedDays)blockedDays=data.blockedDays;if(data.errorLogs)errorLogs=data.errorLogs;if(data.measurements)measurements=data.measurements;

      localStorage.setItem('water',JSON.stringify(water));
      localStorage.setItem('wnotes',JSON.stringify(wnotes));
      localStorage.setItem('swaps2',JSON.stringify(activeSwaps));
      localStorage.setItem('streak2',JSON.stringify(streak));
      localStorage.setItem('diff',JSON.stringify(difficulty));
      localStorage.setItem('cycle',JSON.stringify(cycleData));localStorage.setItem('sleep',JSON.stringify(sleepData));localStorage.setItem('studyChk',JSON.stringify(studyChecks));localStorage.setItem('studyProg',JSON.stringify(studyProgress));localStorage.setItem('blocked',JSON.stringify(blockedDays));localStorage.setItem('errorLogs',JSON.stringify(errorLogs));localStorage.setItem('meas',JSON.stringify(measurements));

function getSleep(){return sleepData[todayKey()]||''}
function getSleepAvg(){
  const today=new Date();
  let total=0,count=0;
  for(let i=0;i<7;i++){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    if(sleepData[key]){total+=parseFloat(sleepData[key]);count++;}
  }
  return count>0?(total/count).toFixed(1):'—';
}

function getSleepMsg(hrs){
  if(!hrs)return'';hrs=parseFloat(hrs);
  if(hrs>=8)return'perfect 💖 your muscles are loving you';
  if(hrs>=7)return'solid 😊 good recovery';
  if(hrs>=6)return'okay but try for more 🌙';
  return'your body needs more rest 💜 aim for 7-8hrs';
}

function getPRs(){
  const prs={};
  Object.entries(wlogHist).forEach(([k,hist])=>{
    const name=k.replace('hist::','').replace(/^\d+::/,'');
    hist.forEach(h=>{
      const w=parseFloat(h.w);
      if(!prs[name]||w>prs[name].w){prs[name]={w:w,d:h.d};}
    });
  });
  return prs;
}

function saveMeasurement(){
  const mw=document.getElementById('meas-waist');const w=mw?mw.value:'';
  const mh=document.getElementById('meas-hips');const h=mh?mh.value:'';
  const mg=document.getElementById('meas-glutes');const g=mg?mg.value:'';
  if(!w&&!h&&!g){alert('enter at least one measurement');return;}
  measurements.push({d:todayKey(),waist:w||'',hips:h||'',glutes:g||''});
  if(measurements.length>20)measurements=measurements.slice(-20);
  localStorage.setItem('meas',JSON.stringify(measurements));
  window._scrollSave=window.scrollY;render();
}

function getMeasChange(field){
  if(measurements.length<2)return null;
  const recent=measurements.filter(m=>m[field]);
  if(recent.length<2)return null;
  const first=parseFloat(recent[0][field]);
  const last=parseFloat(recent[recent.length-1][field]);
  return{diff:(last-first).toFixed(1),first,last};
}

function toggleBlockDay(dateStr){
  if(blockedDays[dateStr]){delete blockedDays[dateStr];}
  else{blockedDays[dateStr]=true;}
  localStorage.setItem('blocked',JSON.stringify(blockedDays));
  window._scrollSave=window.scrollY;render();
}
function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}window._scrollSave=window.scrollY;render();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}window._scrollSave=window.scrollY;render();}

// Global click handler for study topics
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-study]");
  if(el){
    var parts=el.getAttribute("data-study").split("::");
    toggleStudyTopic(parts[0],parseInt(parts[1]));
  }
});

function toggleStudyTopic(subj,idx){
  var k=subj+'::'+idx;
  var states=['learn','familiar','practise','secure'];
  var cur=studyProgress[k]||'';
  var ni=states.indexOf(cur)+1;
  if(ni>=states.length){delete studyProgress[k];}
  else{studyProgress[k]=states[ni];}
  localStorage.setItem('studyProg',JSON.stringify(studyProgress));
  window._scrollSave=window.scrollY;render();
}

function getSubjProgress(sk){
  var topics=STUDY[sk].topics;
  var counts={learn:0,familiar:0,practise:0,secure:0};
  topics.forEach(function(_,i){var s=studyProgress[sk+'::'+i];if(s&&typeof s==='string')counts[s]++;});
  var done=counts.secure+counts.practise;
  return{done:done,total:topics.length,pct:topics.length?Math.round((done/topics.length)*100):0,counts:counts};
}

function getTodayStudy(){
  // Find the 2-3 subjects to study today based on priority + lowest completion
  var subjects=Object.keys(STUDY).map(function(sk){
    return{key:sk,name:STUDY[sk].name,emoji:STUDY[sk].emoji,priority:STUDY[sk].priority,pct:getSubjProgress(sk).pct};
  });
  // Sort by: priority first, then lowest completion
  subjects.sort(function(a,b){
    if(a.priority!==b.priority)return a.priority-b.priority;
    return a.pct-b.pct;
  });
  // Return top 3 (but mechanics only if others are >80%)
  var picks=[];
  for(var i=0;i<subjects.length&&picks.length<3;i++){
    if(subjects[i].key==='mechanics'&&picks.length>=2)continue;
    picks.push(subjects[i]);
  }
  return picks;
}

function getMockCountdown(){
  var now=new Date();var mock=new Date(2026,11,7,9,30);
  var diff=mock-now;if(diff<=0)return"mocks started!";
  return Math.floor(diff/(1000*60*60*24))+" days to mocks";
}

function isTD(d){return cfg.schedule[d]!==null&&cfg.schedule[d]!==undefined}
function getWO(d){const w=cfg.schedule[d];return(w!==null&&w!==undefined)?WO[w]:null}
function getMeals(d){
  const m=JSON.parse(JSON.stringify(BM[d].m));
  if(isTD(d)){m.preworkout=PRE[d]||PRE[1];m.postworkout=POST[d]||POST[4];}
  else{m.postworkout=POST[d]||POST[6];}
  // Check for active swaps on any meal
  ['breakfast','lunch','dinner','snack'].forEach(k=>{
    const sk=d+'::'+k;
    if(activeSwaps[sk]){
      const recipe=SWAP_RECIPES[activeSwaps[sk]];
      m[k]={name:activeSwaps[sk],protein:m[k].protein,desc:recipe?'':'Quick swap.',swapped:true,originalName:BM[d].m[k].name,mealKey:k,ingredients:recipe?recipe.ingredients:null,steps:recipe?recipe.steps:null};
    }
  });
  return m;
}
function getDP(d){return Object.values(getMeals(d)).reduce((s,m)=>s+parseInt(m.protein),0)}
function todayI(){return(new Date().getDay()+6)%7}
function getWeekStats(){
  let woDone=0,totalSets=0,totalSetsDone=0;
  for(let i=0;i<7;i++){if(!isTD(i))continue;let dayDone=false;
    const wo=getWO(i);if(!wo)continue;
    wo.sec.forEach(s=>s.ex.forEach(e=>{for(let j=0;j<e.s;j++){totalSets++;const k=i+'::'+e.n+'::'+j;if(setD[k]){totalSetsDone++;dayDone=true}}})
    );if(dayDone)woDone++;}
  const avgP=Math.round(DN.reduce((s,_,i)=>s+getDP(i),0)/7);
  return{woDone,trainDays:cfg.schedule.filter(s=>s!==null&&s!==undefined).length,totalSets,totalSetsDone,avgP}
}

  if(data.errorLogs)errorLogs=data.errorLogs;if(data.blockedDays)blockedDays=data.blockedDays;

function syncToFirebase(){
  if(!syncKey)return;
  var data=getAllData();
  fetch(FIREBASE_URL+'/users/'+encodeURIComponent(syncKey)+'.json',{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  }).then(function(){lastSyncTime=Date.now();}).catch(function(e){console.log('Sync error:',e);});
}

function syncFromFirebase(callback){
  if(!syncKey)return;
  fetch(FIREBASE_URL+'/users/'+encodeURIComponent(syncKey)+'.json')
  .then(function(r){return r.json()})
  .then(function(data){
    if(data&&data.lastSync){
      applySyncData(data);
      lastSyncTime=data.lastSync;
      if(callback)callback(true);
    }else{
      if(callback)callback(false);
    }
  }).catch(function(e){console.log('Sync error:',e);if(callback)callback(false);});
}

function debouncedSync(){
  if(!syncKey)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncToFirebase,2000);
}

function setSyncKey(key){
  syncKey=key;
  localStorage.setItem('syncKey',key);
  if(key){
    syncFromFirebase(function(found){
      if(found){render();}
      else{syncToFirebase();}
    });
  }
}

// Auto-sync on load
if(syncKey){
  syncFromFirebase(function(found){
    if(found)render();
  });
}
